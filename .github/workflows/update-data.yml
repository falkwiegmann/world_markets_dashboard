name: Update data & deploy

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 min; off-the-hour to dodge cron congestion
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch market data
        run: python3 fetch_markets.py --deep

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js data.js favicon.svg _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
